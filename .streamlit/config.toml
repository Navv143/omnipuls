# Omnipuls theme: dark work area with a darker sidebar. The three selectable layouts
# (Account > Appearance) restyle the sidebar and tables on top of this.
[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131D2F"
textColor = "#E6EDF7"
borderColor = "#22314A"
dataframeHeaderBackgroundColor = "#1E293B"
dataframeHeaderTextColor = "#E6EDF7"
# Type: Inter for text and numbers (clear at small sizes, fixed-width digits so ticking prices don't jump),
# Sora for headings (the brand font of the logo), JetBrains Mono for figures in cards and code.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
headingFont = "Sora:https://fonts.googleapis.com/css2?family=Sora:wght@500..700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&display=swap"
headingFontSizes = ["1.9rem", "1.45rem", "1.15rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
# Charts: up / down / accent first, then a colour-blind-safe set
chartCategoricalColors = ["#3B82F6", "#26A69A", "#EF5350", "#E8B33A", "#A78BFA", "#22D3EE", "#F472B6", "#94A3B8", "#FB923C", "#4ADE80"]
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#070D18"
secondaryBackgroundColor = "#131D2F"
textColor = "#E2E8F0"
borderColor = "#22314A"
primaryColor = "#38BDF8"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
